services:
  # Service unique : l'API Express sert aussi le frontend compilé.
  # C'est l'URL ouverte par les préparateurs (picking-webapp.onrender.com).
  - type: web
    name: picking-webapp
    env: node
    region: frankfurt
    plan: free
    # Le frontend est construit ici : app.js le sert depuis frontend/dist quand
    # NODE_ENV=production. VITE_API_URL=/api est indispensable — Vite fige cette
    # valeur dans le bundle, et sans elle le navigateur du préparateur appellerait
    # http://localhost:3000/api. Servi sur la même origine, un chemin relatif suffit.
    buildCommand: cd frontend && npm install && VITE_API_URL=/api npm run build && cd ../backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: picking-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      # À définir manuellement dans le dashboard Render
      - key: WC_URL
        sync: false
      - key: WC_CONSUMER_KEY
        sync: false
      - key: WC_CONSUMER_SECRET
        sync: false
      # Slug du statut WooCommerce appliqué quand l'app valide une commande.
      # Vide = completed. À renseigner avec le statut « prêt pour expédition ».
      - key: WC_STATUS_ON_COMPLETE
        sync: false

databases:
  - name: picking-db
    databaseName: picking
    plan: free
